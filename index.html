<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiMondo - Daily Wikipedia Quiz</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #00d26a; /* Vibrant Green */
            --secondary-color: #2c2c2c;
            --highlight-color: #2c3e50;
            --error-color: #ff5252;
            --font-main: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 3px;
            font-weight: 800;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
            font-family: monospace;
        }

        /* Loading */
        .loading-spinner {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-top: 50px;
        }
        .loading-spinner::after {
            content: " ";
            display: block;
            width: 30px;
            height: 30px;
            margin: 20px auto;
            border-radius: 50%;
            border: 3px solid #333;
            border-color: #333 transparent #333 transparent;
            animation: ring 1.2s linear infinite;
        }
        @keyframes ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Game Area */
        .hint-box {
            background-color: var(--secondary-color);
            padding: 25px;
            border-radius: 12px;
            line-height: 1.9;
            font-size: 1.05rem;
            min-height: 180px;
            white-space: pre-wrap;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        
        /* 伏せ字のスタイル */
        .masked-word {
            background-color: #444;
            color: transparent;
            border-radius: 4px;
            margin: 0 2px;
            user-select: none;
            transition: color 0.3s, background-color 0.3s;
        }
        
        .revealed-char {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            display: flex;
            gap: 12px;
            position: relative;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #444;
            background: #1e1e1e;
            color: var(--text-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            background: #252525;
        }

        button#submit-btn {
            padding: 0 30px;
            font-size: 1rem;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, opacity 0.2s;
        }

        button#submit-btn:active {
            transform: scale(0.96);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        .status-message {
            text-align: center;
            min-height: 24px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .status-message.error { color: var(--error-color); }

        /* Modal / Results */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #222;
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transform: translateY(20px);
            transition: transform 0.4s;
        }
        
        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .result-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .result-answer {
            font-size: 1.4rem;
            color: #fff;
            margin: 20px 0;
            font-weight: bold;
            padding: 10px;
            border-bottom: 1px solid #444;
            border-top: 1px solid #444;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .stat-box {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }
        
        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }
        .stat-label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-top: 5px; }

        .action-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .wiki-link-btn {
            background-color: transparent;
            border: 1px solid #555;
            color: #ccc;
            margin-bottom: 10px;
        }
        
        .timer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666;
            font-family: monospace;
        }

        /* Shake Animation */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WikiMondo</h1>
        <div class="subtitle" id="date-display"></div>
    </header>

    <div id="loading" class="loading-spinner">Wikipediaから本日の問題を抽出中...</div>

    <div id="game-area" style="display: none;">
        <div class="status-message" id="status-msg"></div>
        
        <div class="hint-box" id="hint-text"></div>
        
        <div class="status-bar">
            <span>文字開示率: <span id="progress-percent" style="color: var(--accent-color); font-weight:bold;">0</span>%</span>
            <span id="char-count-info"></span>
        </div>

        <div class="input-area">
            <input type="text" id="guess-input" placeholder="記事のタイトルは？" autocomplete="off">
            <button id="submit-btn">回答</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="result-modal">
    <div class="modal">
        <div class="result-title" id="modal-title">RESULT</div>
        
        <div class="result-answer" id="modal-answer"></div>
        
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-val" id="stat-progress">0%</span>
                <span class="stat-label">開示率 (Score)</span>
            </div>
            <div class="stat-box">
                <span class="stat-val" id="stat-attempts">0</span>
                <span class="stat-label">誤答数</span>
            </div>
        </div>

        <button class="action-btn wiki-link-btn" id="wiki-btn">
            Wikipediaで記事を読む
        </button>

        <button class="action-btn" id="share-btn">
            結果をシェアする
        </button>
        
        <div class="timer" id="next-quiz-timer">--:--:--</div>
    </div>
</div>

<script>
    // --- Config ---
    // Wikipedia API関連
    const WIKI_API = "https://ja.wikipedia.org/w/api.php";
    // 検索対象カテゴリ: 良質な記事 (質と知名度が担保されている)
    const TARGET_CATEGORY = "Category:良質な記事";
    // 五十音リスト（検索開始位置のランダム化に使用）
    const SORT_KEYS = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ";

    // --- State ---
    const STATE = {
        todayStr: new Date().toLocaleDateString('ja-JP'),
        targetWord: "",     // 正解の単語
        fullText: "",       // 元のテキスト（答えは伏せ字前）
        displayHtml: "",    // 表示用のHTML（答えはタグで囲む）
        revealedCount: 0,   // 現在見えている文字数
        totalChars: 0,      // テキストの総文字数
        isGameOver: false,
        attempts: 0,
        intervalId: null,
        seedVal: 0          // 今日の乱数シード
    };

    const ELS = {
        loading: document.getElementById('loading'),
        gameArea: document.getElementById('game-area'),
        hintText: document.getElementById('hint-text'),
        input: document.getElementById('guess-input'),
        btn: document.getElementById('submit-btn'),
        status: document.getElementById('status-msg'),
        date: document.getElementById('date-display'),
        percent: document.getElementById('progress-percent'),
        charCountInfo: document.getElementById('char-count-info'),
        modal: document.getElementById('result-modal'),
        modalTitle: document.getElementById('modal-title'),
        modalAnswer: document.getElementById('modal-answer'),
        statProgress: document.getElementById('stat-progress'),
        statAttempts: document.getElementById('stat-attempts'),
        shareBtn: document.getElementById('share-btn'),
        wikiBtn: document.getElementById('wiki-btn'),
        timer: document.getElementById('next-quiz-timer')
    };

    // --- Random Number Generator (Seeded) ---
    // 日付文字列をシードにして、常に同じ乱数系列を生成する
    function xmur3(str) {
        let h = 1779033703 ^ str.length;
        for(let i = 0; i < str.length; i++) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = h << 13 | h >>> 19;
        }
        return function() {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
        }
    }
    function mulberry32(a) {
        return function() {
            var t = a += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    // --- Wikipedia API Logic ---
    
    // APIから今日の記事を取得するメインフロー
    async function fetchDailyProblem() {
        try {
            // 1. 日付シードを作成
            const seedFunc = xmur3(STATE.todayStr);
            const rng = mulberry32(seedFunc()); // これが乱数生成器(0.0 - 1.0)
            STATE.seedVal = rng; // 保持

            // 2. 検索の開始文字(あ-ん)をランダムに決定
            // これにより、毎日「良質な記事」リストの異なる場所から検索を始める
            const sortKeyIndex = Math.floor(rng() * SORT_KEYS.length);
            const startSortKey = SORT_KEYS[sortKeyIndex];
            
            // 3. カテゴリメンバーを取得
            // cmtype=page (サブカテゴリ除外), cmlimit=50 (候補として十分な数)
            const listUrl = `${WIKI_API}?action=query&list=categorymembers&cmtitle=${encodeURIComponent(TARGET_CATEGORY)}&cmtype=page&cmsort=sortkey&cmstartsortkey=${encodeURIComponent(startSortKey)}&cmlimit=50&format=json&origin=*`;
            
            const listRes = await fetch(listUrl);
            const listData = await listRes.json();
            
            if (!listData.query || !listData.query.categorymembers || listData.query.categorymembers.length === 0) {
                // 検索結果がない場合（稀）、"あ"から再検索などのフォールバックが必要だが、
                // 簡単のため、もう一度固定の「あ」で検索する簡易リトライ
                return fetchFallbackProblem();
            }

            // 4. 候補リストからフィルタリング (5文字以上)
            // 括弧書き（アニメ）などを除く処理を入れても良いが、今回はシンプルに文字数のみ
            let candidates = listData.query.categorymembers.filter(item => {
                // 曖昧さ回避などを簡易除外、タイトル文字数チェック
                return item.title.length >= 5 && !item.title.includes("一覧");
            });

            if (candidates.length === 0) {
                // フィルタ後に残らなかった場合もフォールバック
                return fetchFallbackProblem();
            }

            // 5. 候補の中から1つ選ぶ (ここでもシード乱数を使う)
            // 先ほどのrngは使い回すと状態が進むのでOK
            const pickIndex = Math.floor(rng() * candidates.length);
            const selectedPage = candidates[pickIndex];
            
            // 6. 選ばれた記事の本文（概要）を取得
            return await fetchArticleDetail(selectedPage.title);

        } catch (e) {
            console.error(e);
            alert("問題の取得に失敗しました。ページをリロードしてください。");
            return null;
        }
    }

    // フォールバック（万が一検索ヒットしなかった場合、固定の有名記事などを出す安全策）
    // 今回は簡易的に「秀逸な記事」カテゴリの先頭を取りに行く
    async function fetchFallbackProblem() {
        const backupTitle = "インターネット"; // 最終手段
        return await fetchArticleDetail(backupTitle);
    }

    async function fetchArticleDetail(title) {
        const detailUrl = `${WIKI_API}?action=query&format=json&prop=extracts&exintro&explaintext&origin=*&titles=${encodeURIComponent(title)}`;
        const res = await fetch(detailUrl);
        const data = await res.json();
        const pages = data.query.pages;
        const pageId = Object.keys(pages)[0];
        
        if (pageId === "-1") throw new Error("Page details not found");
        
        const extract = pages[pageId].extract;
        return {
            title: title,
            text: extract
        };
    }

    // --- Game Logic ---

    function prepareText(title, text) {
        // 1. テキストのクリーニング
        let cleanText = text.replace(/\n/g, "");
        if(cleanText.length > 280) cleanText = cleanText.substring(0, 280) + "...";

        // 2. 答え（タイトル）の隠蔽処理
        // カッコ書き（例：林檎 (果物)）がある場合、メインの単語「林檎」だけ隠すか、全部隠すか。
        // ここでは、スペースやカッコの前までをメインアンサーとみなす簡易ロジック
        // あるいはタイトルそのものを隠す。
        // タイトルに含まれる単語が本文に出てきたら全て隠す。
        
        // タイトルから「_」をスペースに
        const safeTitle = title.replace(/_/g, " ");
        // 括弧除去（単純なタイトルマッチのため）
        const coreTitle = safeTitle.replace(/ \(.*\)/, ""); 
        
        // 本文中のタイトルを隠す（大文字小文字無視）
        // 長い順に置換しないと、部分一致で崩れる可能性があるが、今回はcoreTitleのみ
        const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(escapeRegExp(coreTitle), 'gi');

        // 置換ロジック: 
        // 表示用HTML配列を作るために、テキストを分解するのではなく、
        // 1文字ずつのオブジェクト配列を作るのがアニメーションしやすい。
        
        let processedChars = []; // { char: string, isMasked: bool }

        // マッチ箇所を特定してフラグを立てるのは複雑なので、
        // 一旦プレースホルダーに置換してから、配列に展開する戦略をとる。
        // ただし、文字数を維持したいので、マッチした文字列の長さ分だけ特別なMASK文字を入れる。
        
        // 単純化: 本文をスキャンして、マスク対象インデックスを特定する
        let maskIndices = new Set();
        let match;
        while ((match = regex.exec(cleanText)) !== null) {
            for(let i = 0; i < match[0].length; i++) {
                maskIndices.add(match.index + i);
            }
        }

        // 配列生成
        for(let i=0; i<cleanText.length; i++) {
            processedChars.push({
                char: cleanText[i],
                isMasked: maskIndices.has(i)
            });
        }

        return {
            title: title,
            chars: processedChars
        };
    }

    async function initGame() {
        ELS.date.textContent = STATE.todayStr;
        
        // Check LocalStorage
        const saveKey = `wikimondo_v2_${STATE.todayStr}`; // version 2 key
        const savedData = localStorage.getItem(saveKey);

        if (savedData) {
            const parsed = JSON.parse(savedData);
            STATE.targetWord = parsed.word; // 必要
            showResultModal(parsed.success, parsed.attempts, parsed.progress);
            ELS.loading.style.display = 'none';
            return;
        }

        // Fetch Data
        const problem = await fetchDailyProblem();
        if(!problem) return;

        STATE.targetWord = problem.title;
        const prepared = prepareText(problem.title, problem.text);
        
        // Setup DOM
        ELS.hintText.innerHTML = ""; // clear
        STATE.totalChars = prepared.chars.length;
        
        // Create invisible spans for all chars first
        prepared.chars.forEach(item => {
            const span = document.createElement("span");
            if (item.isMasked) {
                span.textContent = "🔒"; // 表示用
                span.dataset.char = item.char; // 本来の文字（デバッグ用・あるいは正解後表示用）
                span.className = "masked-word";
            } else {
                span.textContent = item.char;
                span.style.opacity = "0"; // Initially hidden
            }
            ELS.hintText.appendChild(span);
        });

        ELS.loading.style.display = 'none';
        ELS.gameArea.style.display = 'block';
        ELS.charCountInfo.textContent = `文字数: ${STATE.targetWord.length}`;

        startReveal();
    }

    function startReveal() {
        const spans = ELS.hintText.querySelectorAll("span:not(.masked-word)");
        const totalToReveal = spans.length;
        let currentIndex = 0;

        // 1文字あたりの速度調整: 全文を45秒くらいで出す
        // speed = 45000ms / chars
        let speed = 45000 / STATE.totalChars;
        if(speed < 50) speed = 50; // 最速
        if(speed > 200) speed = 200; // 最遅

        STATE.intervalId = setInterval(() => {
            if (currentIndex < totalToReveal && !STATE.isGameOver) {
                const span = spans[currentIndex];
                span.className = "revealed-char";
                span.style.opacity = "1";
                
                currentIndex++;
                STATE.revealedCount++; // Note: masked words don't count as "revealed" action but are part of total
                
                // 全体の進捗率（マスク文字は最初から見えている扱いにはせず、時間経過の割合とする）
                // 簡易的に： (現在のインデックス / 開くべき文字数) * 100
                // ※マスク文字も含めた全体進捗にする
                const currentTotalIndex = Array.from(ELS.hintText.children).indexOf(span);
                const pct = Math.floor(((currentTotalIndex + 1) / STATE.totalChars) * 100);
                ELS.percent.textContent = pct;

            } else {
                clearInterval(STATE.intervalId);
                if(!STATE.isGameOver && currentIndex >= totalToReveal) {
                    // 全部開いた
                    ELS.percent.textContent = 100;
                }
            }
        }, speed);
    }

    function checkAnswer() {
        if (STATE.isGameOver) return;

        const userGuess = ELS.input.value.trim();
        if (!userGuess) return;

        // 判定ロジック
        // 括弧などのゆらぎを許容する
        const normalize = (str) => str.replace(/\s/g, "").replace(/[（(].*[）)]/g, "").toLowerCase();
        
        const targetNorm = normalize(STATE.targetWord);
        const guessNorm = normalize(userGuess);

        if (guessNorm === targetNorm && guessNorm.length > 0) {
            endGame(true);
        } else {
            STATE.attempts++;
            ELS.status.textContent = `不正解... (誤答数: ${STATE.attempts})`;
            ELS.status.className = "status-message error";
            ELS.input.value = "";
            ELS.input.classList.add("shake");
            setTimeout(() => ELS.input.classList.remove("shake"), 500);
        }
    }

    function endGame(success) {
        STATE.isGameOver = true;
        clearInterval(STATE.intervalId);
        
        // Calculate score
        const currentPct = parseInt(ELS.percent.textContent) || 0;
        
        // Save
        const resultData = {
            success: success,
            attempts: STATE.attempts,
            progress: currentPct,
            word: STATE.targetWord
        };
        localStorage.setItem(`wikimondo_v2_${STATE.todayStr}`, JSON.stringify(resultData));

        showResultModal(success, STATE.attempts, currentPct);
    }

    function showResultModal(success, attempts, progress) {
        ELS.modal.classList.add('active');
        ELS.modalTitle.textContent = success ? "CLEARED" : "FAILED";
        ELS.modalTitle.style.color = success ? "var(--accent-color)" : "var(--error-color)";
        
        // 答えがまだロードされてない場合（localstorage読み出し時など）
        // STATE.targetWordがあればそれを使う
        ELS.modalAnswer.textContent = STATE.targetWord;

        ELS.statProgress.textContent = progress + "%";
        ELS.statAttempts.textContent = attempts;

        // Wikipedia Button
        ELS.wikiBtn.onclick = () => {
            window.open(`https://ja.wikipedia.org/wiki/${encodeURIComponent(STATE.targetWord)}`, '_blank');
        };

        setupShareButton(success, attempts, progress);
        setupTimer();
    }

    function setupShareButton(success, attempts, progress) {
        ELS.shareBtn.onclick = () => {
            // スコアに応じた絵文字バー
            // 低い％で正解するほど偉いので、逆にする？
            // いや、Mondoは開けた量なので、少ないほうがすごい。
            // ここでは「開示率」＝「ヒント使用量」なので、少ないほうが優秀。
            
            const blocks = 5;
            const filled = Math.ceil((progress / 100) * blocks); 
            // 例: 20% -> 1個, 100% -> 5個
            // 緑＝開いてしまった部分、黒＝隠せていた部分 と表現するか、
            // 緑＝スコア（逆）とするか。
            // 素直に「開いた量」を赤や黄色で示すのもありだが、シンプルに緑ブロックで量を示す。
            
            let bar = "";
            for(let i=0; i<blocks; i++) {
                if(i < filled) bar += "🟩";
                else bar += "⬛";
            }

            const text = `WikiMondo ${STATE.todayStr}\n開示率: ${progress}% (誤答${attempts})\n${bar}\nhttps://your-github-username.github.io/wikimondo/`; 
            // ↑ URLは自分のものに変えてください

            navigator.clipboard.writeText(text).then(() => {
                const originalText = ELS.shareBtn.innerText;
                ELS.shareBtn.innerText = "コピーしました！";
                setTimeout(() => ELS.shareBtn.innerText = originalText, 2000);
            }).catch(err => {
                alert("コピーに失敗しました");
            });
        };
    }

    function setupTimer() {
        const updateTimer = () => {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            
            const diff = tomorrow - now;
            const h = Math.floor(diff / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            ELS.timer.textContent = `NEXT QUIZ: ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        };
        setInterval(updateTimer, 1000);
        updateTimer();
    }

    // --- Event Listeners ---
    ELS.btn.addEventListener('click', checkAnswer);
    ELS.input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });

    // Start
    initGame();

</script>
</body>
</html>
